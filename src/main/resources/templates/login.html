<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <div class="form-box">

            <h2>Login</h2>

            <!-- Error Message -->
            <p th:if="${error}"
               th:text="${error}"
               style="color:red; text-align:center;">
            </p>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post">

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">Login</button>

            </form>

            <p class="bottom-text">
                Don't have an account?
                <a th:href="@{/register}">Sign Up</a>
            </p>

        </div>

    </div>

</body>
</html>
