<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
 <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body>

    <div class="container">

        <div class="form-box">

            <h2>Register</h2>

            <!-- Error Message -->
            <p th:if="${error}"
               th:text="${error}"
               style="color:red; text-align:center;">
            </p>

            <!-- Registration Form -->
            <form th:action="@{/register}"
                  method="post"
                  onsubmit="return validatePassword()">

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

                <input type="email"
                       name="email"
                       placeholder="Email"
                       required>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Password"
                       required>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm Password"
                       required>

                <button type="submit">Register</button>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a th:href="@{/login}">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
